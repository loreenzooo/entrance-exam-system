<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='admin/css/admin.css') }}">
</head>

<body>
    <div class="admin-layout">
        <aside class="sidebar">
            <div class="sidebar-brand">Entrance Exam<br>Admin</div>
            <nav>
                <a href="{{ url_for('admin.dashboard') }}"
                    class="{{ 'active' if request.endpoint == 'admin.dashboard' }}">Dashboard</a>
                <a href="{{ url_for('admin.programs') }}"
                    class="{{ 'active' if request.endpoint == 'admin.programs' }}">Programs</a>
                <a href="{{ url_for('admin.batches') }}"
                    class="{{ 'active' if request.endpoint in ['admin.batches', 'admin.edit_batch'] }}">Exam Batches</a>
                <a href="{{ url_for('admin.applicants') }}"
                    class="{{ 'active' if request.endpoint in ['admin.applicants', 'admin.edit_applicant'] }}">Applicants</a>
                <a href="{{ url_for('admin.attendance') }}"
                    class="{{ 'active' if request.endpoint in ['admin.attendance', 'admin.edit_attendance'] }}">Attendance</a>
                <a href="{{ url_for('admin.audit_logs') }}">Audit Logs</a>
            </nav>
            <a href="{{ url_for('admin_auth.logout') }}" class="logout">Log Out</a>
        </aside>
        <main class="admin-content">
            {% block content %}{% endblock %}
        </main>
    </div>
</body>

</html>
