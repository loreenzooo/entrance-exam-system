{% extends "admin/base_admin.html" %}
{% block title %}Edit Applicant{% endblock %}
{% block content %}

    <h1 class="page-heading">Edit Applicant</h1>
    <p class="page-subtext">{{ applicant.full_name }}</p>

    <div class="inline-form-card">
        <form method="POST">
            <div class="field">
                <label for="full_name">Full Name</label>
                <input type="text" id="full_name" name="full_name" value="{{ applicant.full_name }}" required>
            </div>
            <div class="field">
                <label for="age">Age</label>
                <input type="number" id="age" name="age" min="10" max="100" value="{{ applicant.age }}" required>
            </div>
            <div class="field">
                <label for="contact_number">Contact Number</label>
                <input type="text" id="contact_number" name="contact_number" value="{{ applicant.contact_number }}" required>
            </div>
            <div class="field">
                <label for="program_id">Program</label>
                <select id="program_id" name="program_id" required>
                    {% for program in programs %}
                        <option value="{{ program.id }}" {% if program.id == applicant.program_id %}selected{% endif %}>
                            {{ program.program_name }}
                        </option>
                    {% endfor %}
                </select>
            </div>
            <button type="submit" class="btn-primary">Save Changes</button>
        </form>
    </div>

    <a href="{{ url_for('admin.applicants') }}" class="link-button">Cancel</a>

{% endblock %}
