<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Exam Kiosk{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='kiosk/css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='kiosk/css/components.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    {% block shell %}
    <div class="kiosk-shell">
        <div class="kiosk-card">
            {% block content %}{% endblock %}
        </div>
    </div>
    {% endblock %}
</body>
</html>
